# ============================================================
# OpenSpec Change Driver — глобальные настройки проекта
# ============================================================

# ============================================================
# ⚠ ВСЯ СЕКЦИЯ project_context МЕНЯЕТСЯ ОТ ПРОЕКТА К ПРОЕКТУ.
# Движок дженерик: язык, фреймворки и структуру каталогов он берёт
# ОТСЮДА. Скопировал .agent/ в новый проект — первым делом правь это.
# ============================================================
project_context:
  # Стек. Уходит в промпт каждого шага; для кодогенерации определяет
  # язык, расширения файлов и тестовые библиотеки.
  tech_stack: "Kotlin, Android SDK, Jetpack Compose, Room (офлайн-кэш), Retrofit + OkHttp, Coroutines/Flow, JUnit + MockWebServer"

  # Договорённости команды — модель следует этому при генерации кода.
  code_style: "Conventional Commits, MVVM, UDF-однонаправленный поток данных"

  # Базовый пакет / неймспейс.
  base_package: "com.mnemocards"

  # Корень исходников — куда кодогенерация кладёт файлы.
  # Android: модуль app, исходники Kotlin лежат в java/ (так принято).
  source_root: "app/src/main/java"

ai_settings:
  # Z.AI Coding Plan (OpenAI-совместимый API).
  # ВАЖНО: у Coding Plan свой endpoint — /api/coding/paas/v4.
  # Обычный /api/paas/v4 — это pay-as-you-go, ключ подписки там не работает.
  base_url: "https://api.z.ai/api/coding/paas/v4"
  model: "glm-5.3"
  temperature: 0.2
  max_tokens: 30000
  # В потоковом режиме таймаут считается МЕЖДУ кусками ответа, а не на весь
  # ответ — длинная генерация по нему не оборвётся.
  timeout_seconds: 900

  # Потоковый режим: имена файлов печатаются по мере генерации, видно что
  # процесс идёт. false — обычный запрос (весь ответ разом; тогда
  # timeout_seconds применяется ко всей генерации и может её оборвать).
  stream: true

  # Произвольные параметры, уходящие в тело запроса к API как есть.
  # Движок их не интерпретирует — просто подмешивает в payload, поэтому
  # новые опции провайдера добавляются правкой конфига, без кода.
  # Действуют на ВСЕ шаги; переопределить на кодогенерации можно
  # через code_generation.extra_params (см. ниже).
  #
  # Здесь пусто: на проектировании (MAIN, proposal, spec, tasks)
  # размышления модели полезны — пусть думает.
  # extra_params:
  #   thinking:
  #     type: "enabled"

  # Ключ только через переменную окружения — в файл не класть:
  #   export ZAI_API_KEY="..."
  api_key_env: "ZAI_API_KEY"

  verify_ssl: true

# ============================================================
# Профили провайдеров: переключение по --profile <name>
# (host + key + model одним флагом; переопределяют ai_settings выше)
# ============================================================
profiles:
  work:                                  # AlfaGen из корпоративной сети
    base_url: "https://alfagen.moscow.alfaintra.net/continue-dev"
    model: "DeepSeek-V4-Flash"
    api_key: "75c482a5-1fa6-47a3-b19b-dbd5c62f8a72"
    api_key_env: "ALFAGEN_API_KEY"
    verify_ssl: false

  glm:                                   # Z.AI Coding Plan (основной профиль)
    base_url: "https://api.z.ai/api/coding/paas/v4"
    model: "glm-5.3"
    api_key_env: "ZAI_API_KEY"
    verify_ssl: true

  home:                                  # локальная Ollama (дома, без сети)
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5-coder:7b"
    verify_ssl: true

pipeline:
  # Создавать ли отдельную git-ветку spec/<change-id> при команде --new
  isolate_git_branch: false

  # Если у изменения нет своего worktree — создавать его автоматически
  # перед кодогенерацией. Кодоген всегда идёт в изоляции, даже если при
  # --new про --worktree забыли.
  # Разовое отключение: флаг --here (генерировать в текущей директории).
  auto_worktree: true

  # Локальные файлы вне git — копируются в новый worktree при создании.
  # local.properties держит путь к Android SDK и лежит в .gitignore:
  # без него Gradle в worktree падает с "SDK location not found" —
  # то есть тесты красные не из-за кода, а из-за окружения.
  worktree_copy:
    - "local.properties"

code_generation:
  # Сначала падающий тест (TDD), затем реализация
  test_first: true

  # Команда прогона тестов ПОСЛЕ записи файлов.
  # Только JVM-тесты (app/src/test) — инструментальные из androidTest
  # требуют запущенного эмулятора, автоматом их не гоняем:
  #   ./gradlew connectedAndroidTest  — запускать руками при живом эмуляторе.
  # Разовое отключение: флаг --no-test.
  test_command: "./gradlew test"

  # Если изменение живёт в своём worktree и тесты позеленели — движок
  # сам коммитит результат, чтобы в основном проекте было что мерджить.
  # Разовое отключение: флаг --no-commit.

  # Сколько задач из tasks.md брать в ОДИН запрос к модели.
  #   0  — весь план одним запросом (на планах вроде change-001 с его
  #        12 задачами модель обрывает файлы на середине)
  #   3–4 — рекомендуется: каждый батч пишет файлы сразу, следующий получает
  #        уже созданные файлы как контекст
  # Разовое переопределение: флаг --batch N.
  batch_size: 3

  # Файлы сборки — передаются модели с актуальным содержимым, чтобы она
  # могла САМА добавить недостающую зависимость и выдать файл целиком.
  # Для Android это пара: каталог версий + зависимости модуля.
  dependency_files:
    - "gradle/libs.versions.toml"
    - "app/build.gradle.kts"

  # Параметры запроса ТОЛЬКО для кодогенерации — накладываются поверх
  # ai_settings.extra_params.
  #
  # Размышления отключены: код пишется по готовым спеке и плану, думать
  # почти не над чем, а reasoning съедает общий с ответом max_tokens.
  # В change-002 батч с размышлениями потратил 383с и вернул пустой ответ;
  # он же без размышлений — 85с и 7 файлов.
  # Вернуть размышления: "enabled" или убрать секцию.
  extra_params:
    thinking:
      type: "disabled"
