id: change-001-ekran-trenirovki-pokazyvaet
prompt: 'Экран тренировки: показывает лицевую сторону карточки со словом, по тапу
  карточка переворачивается и показывает перевод, под ней четыре кнопки оценки — Забыл,
  Трудно, Хорошо, Легко. После оценки показывается следующая карточка из колоды. Когда
  карточки закончились — экран "на сегодня всё". Карточка — это пара строк, лицевая
  сторона и обратная; конкретная языковая пара не зашита, колода может быть на любых
  языках. Данные захардкожены прямо в коде, список из 5 карточек. Никакого хранилища
  и сети в этой фиче нет. Это UI-экран Android на Jetpack Compose — HTTP-запросов,
  эндпоинтов и OpenAPI-контракта тут нет, сценарии описывай в терминах действий пользователя
  и состояний экрана.'
