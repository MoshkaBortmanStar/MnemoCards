id: change-009-sinkhronizatsiya-dannykh-serverom
prompt: 'Синхронизация данных с сервером. Формат запросов, ответов, кодов ошибок и
  правила разрешения конфликтов берутся из specs/API.md и specs/openapi.yaml — это
  источник истины, своего формата не придумывать.


  Сессия синхронизации: сначала список колод, затем карточки каждой живой колоды.
  Для каждого потока клиент хранит свою последнюю полученную ревизию и присылает её
  в запросе; колода, увиденная впервые, запрашивается с нулевой ревизии.


  Отправляются только записи, помеченные как локально изменённые, включая помеченные
  удалёнными. Ответ применяется к локальной базе: запись перезаписывается, помеченная
  удалённой на сервере удаляется локально совсем.


  Признак локального изменения снимается только после успешного ответа и только с
  тех записей, которые не менялись с момента отправки — для этого сравнивается локальный
  счётчик правок, добавленный ранее. Запись, изменённая пока запрос был в пути, остаётся
  помеченной и уйдёт следующей сессией.


  При ответе с признаком полного среза локальное состояние потока полностью заменяется
  содержимым ответа.


  Запуск: автоматически при открытии приложения, если синхронизация настроена, и по
  кнопке на экране настроек. Выполняется в фоне, не блокирует интерфейс.


  Синхронизация не влияет на основной функционал: ошибка сети, недоступность сервера
  или истёкший токен не мешают открывать колоды, учить карточки, создавать и редактировать
  их. Результат последней синхронизации и её ошибки показываются только на экране
  настроек.


  Истёкший токен доступа обновляется через refresh-токен прозрачно, с повторной отправкой
  запроса. Если refresh тоже не принят — состояние меняется на «требуется вход», данные
  при этом не теряются.


  Соблюдай конвенции из specs/MAIN.md: тёмная тема и оформление экранов сохраняются,
  слои и пакеты не меняются, сетевые модели только сгенерированные.'
