id: change-005-algoritm-intervalnykh-povtoreniy
prompt: 'Алгоритм интервальных повторений SM-2 с показом интервалов на кнопках оценки.
  У каждой карточки появляются параметры планирования: коэффициент лёгкости, номер
  повторения, длина текущего интервала и дата следующего показа. После оценки алгоритм
  пересчитывает их: "Забыл" сбрасывает прогресс и показывает карточку снова в этой
  же сессии, "Трудно", "Хорошо" и "Легко" увеличивают интервал с разной силой. На
  каждой из четырёх кнопок ДО нажатия написан интервал, который получится при этой
  оценке — например "10 мин", "1 день", "4 дня". В сессию тренировки попадают только
  карточки, у которых дата следующего показа наступила или прошла; остальные пропускаются.
  На экране списка колод рядом с общим количеством карточек показывается, сколько
  готово к повторению сегодня. Новые карточки, созданные пользователем, считаются
  готовыми к повторению сразу. Параметры планирования хранятся в Room вместе с карточкой;
  существующие карточки не теряются при обновлении схемы базы. Это Android-приложение
  на Kotlin, Jetpack Compose, локальная база Room — сети и сервера тут нет, HTTP-запросов,
  эндпоинтов и OpenAPI-контракта не появляется, сценарии описывай в терминах действий
  пользователя и состояний экрана.'
