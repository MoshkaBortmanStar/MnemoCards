id: change-008-ekran-nastroek-sinkhronizatsii
prompt: 'Экран настроек синхронизации и вход на сервер. Формат запросов, ответов и
  коды ошибок берутся из specs/API.md и specs/openapi.yaml — это источник истины,
  свой формат придумывать нельзя.


  Появляется отдельный экран настроек синхронизации, доступный со списка колод. На
  нём поля: адрес сервера, логин, пароль, кнопка «Проверить соединение» и кнопка «Войти».
  Проверка соединения дёргает эндпоинт доступности и показывает результат понятным
  текстом: сервер отвечает, адрес недоступен, сертификат не принят. Вход отправляет
  логин и пароль, при успехе сохраняет токены и показывает состояние «подключено»,
  при ошибке — причину.


  Токены хранятся в зашифрованном виде через Android Keystore, пароль после входа
  не сохраняется. Адрес сервера сохраняется и переживает перезапуск.


  Пока сервер не настроен — а это состояние по умолчанию — приложение работает ровно
  как раньше: карточки, колоды, тренировка, импорт и экспорт не зависят от синхронизации
  ни в чём. Ошибка сети или недоступность сервера не мешают учить карточки и нигде
  не всплывают, кроме экрана настроек.


  Флаг синхронизации, добавленный в предыдущем изменении, включается после успешного
  входа и выключается при выходе; от него зависит режим удаления записей — мягкий
  или физический.


  Сама синхронизация данных в эту фичу не входит: только настройки, проверка соединения,
  вход и хранение токенов. Сетевые модели берутся из DTO, сгенерированных из openapi.yaml
  тем же плагином, что на сервере — руками их не пишем.


  Соблюдай конвенции из specs/MAIN.md: тёмная тема и оформление экранов сохраняются,
  слои и пакеты не меняются, новых NavHost не создаётся — экран добавляется маршрутом
  в существующий.'
