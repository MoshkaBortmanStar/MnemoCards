id: change-006-import-eksport-kartochek
prompt: 'Импорт и экспорт карточек колоды через CSV-файл. На экране содержимого колоды
  появляются действия «Экспорт» и «Импорт». Экспорт: все карточки колоды выгружаются
  в CSV-файл — две колонки (лицевая сторона и перевод), первая строка — заголовок,
  разделитель запятая, кодировка UTF-8 с BOM (чтобы кириллица корректно открывалась
  в Excel), значения с запятыми, кавычками и переносами строк экранируются кавычками
  по стандарту CSV (RFC 4180); пользователь выбирает, куда сохранить файл, через системный
  диалог (SAF CreateDocument). Импорт: пользователь выбирает CSV-файл через системный
  диалог (SAF OpenDocument), карточки добавляются в текущую колоду, существующие карточки
  не удаляются и не изменяются; импортированные карточки считаются новыми и готовы
  к повторению сразу (как после ручного создания). Строки с пустой лицевой стороной
  или пустым переводом пропускаются; после импорта показывается итог — сколько карточек
  добавлено и сколько строк пропущено. Если файл не CSV или нечитаемый — показывается
  понятная ошибка, колода не меняется. Параметры интервальных повторений в CSV не
  выгружаются и не импортируются, файл содержит только текст карточек. Доступ к файлам
  только через системный выбор документов (Storage Access Framework), без запроса
  разрешений на хранилище. Контекст: Android-приложение на Kotlin + Jetpack Compose,
  локальная база Room, сети и серверов нет — HTTP-запросов, эндпоинтов и OpenAPI-контракта
  не появляется; сценарии описывать в терминах действий пользователя и состояний экрана.'
