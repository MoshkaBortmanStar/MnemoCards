id: change-002-lokalnoe-khranilische-ekran
prompt: 'Локальное хранилище и экран списка колод. Колода — это название и набор карточек.
  Данные хранятся локально на устройстве и переживают перезапуск приложения. При первом
  запуске создаётся базовая колода с текущими пятью словами. Стартовый экран приложения
  — список колод: для каждой видно название и количество карточек. Тап по колоде открывает
  экран тренировки именно этой колоды, кнопка "назад" возвращает к списку. Создания
  и редактирования колод в этой фиче ещё нет. Это Android-приложение на Kotlin, Jetpack
  Compose, локальная база Room — сети и сервера тут нет, HTTP-запросов, эндпоинтов
  и OpenAPI-контракта не появляется, сценарии описывай в терминах действий пользователя
  и состояний экрана.'
