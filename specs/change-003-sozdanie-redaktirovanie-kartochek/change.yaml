id: change-003-sozdanie-redaktirovanie-kartochek
prompt: 'Создание и редактирование карточек внутри колоды. С экрана списка колод можно
  открыть экран содержимого колоды — список её карточек с лицевой и обратной стороной.
  На этом экране: кнопка добавления новой карточки (форма с двумя полями — лицевая
  сторона и перевод), тап по существующей карточке открывает ту же форму для редактирования,
  удаление карточки с подтверждением. Пустые поля сохранять нельзя. Все изменения
  сразу пишутся в Room и переживают перезапуск. Счётчик карточек в списке колод обновляется
  автоматически. Создание и удаление самих колод в эту фичу не входит. Это Android-приложение
  на Kotlin, Jetpack Compose, локальная база Room — сети и сервера тут нет, HTTP-запросов,
  эндпоинтов и OpenAPI-контракта не появляется, сценарии описывай в терминах действий
  пользователя и состояний экрана.'
