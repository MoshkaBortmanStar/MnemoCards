id: change-007-perekhod-globalnye-identifikatory
prompt: 'Переход на глобальные идентификаторы и отслеживание локальных изменений —
  подготовка к синхронизации с сервером. Пользовательского функционала не добавляется,
  экраны выглядят и работают как раньше.


  Колоды и карточки идентифицируются UUID вместо автоинкрементных числовых идентификаторов:
  числовые уникальны только внутри одного устройства и коллизируют при синхронизации
  между устройствами. UUID генерирует само приложение при создании записи. Ссылка
  карточки на колоду тоже становится UUID. Аргументы навигации между экранами становятся
  строковыми.


  У колод и карточек появляется признак локального изменения (isChanged): запись,
  изменённая на устройстве и ещё не отправленная на сервер, помечена как изменённая.
  Признак ставится при создании, редактировании и удалении — всегда, независимо от
  флага синхронизации. Синхронизации в этой фиче ещё нет, поэтому признак только выставляется
  и пока ни с чего не снимается.


  Режим удаления зависит от флага «синхронизация включена». В этой фиче заводится
  локальный персистентный флаг (DataStore), по умолчанию выключен; UI для его переключения
  в этой фиче нет — будущий экран настроек сервера будет им управлять. При выключенном
  флаге удаление физическое, как в текущей версии: строка сразу удаляется из БД, удаление
  колоды каскадно физически удаляет её карточки. При включённом флаге удаление мягкое:
  запись помечается isDeleted = true, но остаётся в базе, пока не будет отправлена
  на сервер. На всех экранах мягко удалённые записи не показываются и не участвуют
  ни в тренировке, ни в счётчиках, ни в экспорте. Мягкое удаление колоды помечает
  удалёнными и все её карточки. Ветвление удаления (мягкое/жёсткое по флагу) реализуется
  в этой фиче и покрывается тестами.


  У каждой записи появляется локальный счётчик правок (revision), увеличивающийся
  при каждом изменении. Он понадобится синхронизации, чтобы не потерять правку, сделанную
  пока запрос был в пути.


  Существующие данные не теряются при обновлении схемы: для каждой имеющейся колоды
  и карточки генерируется UUID, ссылки карточек на колоды пересчитываются на новые
  идентификаторы. Пользователь после обновления видит те же колоды и карточки с той
  же статистикой повторений.


  Сетевого взаимодействия, экрана настроек сервера и самой синхронизации в этой фиче
  нет — только подготовка данных. Это Android-приложение на Kotlin, Jetpack Compose,
  локальная база Room. HTTP-запросов, эндпоинтов и OpenAPI-контракта тут не появляется,
  сценарии описывай в терминах действий пользователя и состояний данных.

  '
